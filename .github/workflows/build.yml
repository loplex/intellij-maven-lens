# GitHub Actions workflow for building, testing and verifying the plugin:
# - Check what a release has to be true of, which needs neither Java nor Gradle.
# - Build the plugin ZIP with the 'buildPlugin' task and upload it as a workflow artifact.
# - Run the 'check' task and upload test reports on failure.
# - Run the 'verifyPlugin' task and upload Plugin Verifier reports.
#
# Drafting a release is not here. It is asked for, by running 'Prepare release' by hand, rather
# than happening on every push to 'main': a draft made from whatever the branch happens to hold is
# a release nobody decided to make.
#
# The workflow is triggered on pushes to 'main' and 'develop', on pull_request events, and by hand.
#
# GitHub Actions reference: https://docs.github.com/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to the long-lived branches only - a push to a branch that has a
  # pull request open would otherwise be checked twice, once for each event
  push:
    branches: [ main, develop ]
  # Trigger the workflow on any pull request
  pull_request:
  # Trigger the workflow by hand, on any branch, for a branch that has no pull request yet
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Neither Java nor Gradle: these read Markdown, the tags and the working tree, and answer in seconds.
  checks:
    name: Check the release rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The released sections are compared against the tags that released them.
          fetch-depth: 0

      - run: python3 -m unittest discover -s tools

      # A released section is a text that has been handed to readers - the release notes on GitHub and the
      # change notes on the Marketplace both. Merging the release branch back is where one can quietly change:
      # a three-way merge will put an entry added to [Unreleased] after the branch point into the released
      # section instead, cleanly and without a conflict, because Git merges lines and cannot see that a heading
      # is a container.
      - run: tools/check-release.py changelog

      # A tag is the only thing that still says which commit a release was built and signed from, and a rewrite
      # of the commits around it - a squash merge, a rebase merge, `Update with rebase`, a force-push - leaves
      # it pointing at a commit no branch reaches. Asked here rather than forbidden in the repository's
      # settings: the list of ways to rewrite a branch is GitHub's to extend, and this holds for all of them.
      - run: tools/check-release.py ancestry

  # Prepare the environment and build the plugin
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Build plugin
      - name: Build plugin
        run: ./gradlew buildPlugin

      # Store an already-built plugin as an artifact for downloading
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip

  # Run tests and upload test reports on failure
  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Run tests
      - name: Run Tests
        run: ./gradlew check

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool
      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPlugin

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
