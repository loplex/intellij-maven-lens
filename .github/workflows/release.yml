# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.
#
# A run started by a release event executes this file as it existed at the released tag, not as it
# exists now - so a fix made here can never reach a release that was already cut. That is what the
# manual trigger is for: a workflow_dispatch run executes the file from the branch it is started
# on, and is given the tag to work with, which is the only way to re-run a release with a repaired
# workflow short of moving the tag.

name: Release
on:
  release:
    types: [ prereleased, released ]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to process again, e.g. 0.1.0
        required: true
        type: string

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # A release event carries the tag and the notes in its payload; a manual run is given only
      # the tag and reads the notes back off the release itself. Everything below works from these
      # two values, so it no longer matters which trigger started the run.
      - name: Resolve Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Kept outside the workspace, which the changelog step re-checks-out from under itself.
          NOTE_FILE="$RUNNER_TEMP/release_note.md"
          gh release view "$TAG" --json body --jq '.body' > "$NOTE_FILE"
          echo "note-file=$NOTE_FILE" >> "$GITHUB_OUTPUT"

          if [ -s "$NOTE_FILE" ]; then
            echo "has-note=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-note=false" >> "$GITHUB_OUTPUT"
          fi

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Publish the plugin to JetBrains Marketplace.
      #
      # The first version of a new plugin has to be uploaded by hand - the Marketplace API can
      # only add an update to a listing that already exists - so on that first release this task
      # is bound to report the version as already present, and would take the steps below it down
      # with it: the release asset and the changelog pull request, neither of which has anything
      # to do with the Marketplace. Exactly that one message is tolerated here; every other
      # failure - bad token, signing, a rejected upload - still fails the job.
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          OUTPUT=$(./gradlew publishPlugin 2>&1) && STATUS=0 || STATUS=$?
          echo "$OUTPUT"

          if [ "$STATUS" -ne 0 ] && grep -q 'already contains version' <<< "$OUTPUT"; then
            echo "::warning::This version is already on the Marketplace - it was uploaded manually. Skipping the upload."
            exit 0
          fi

          exit "$STATUS"

      # Attach the distribution to the release, without touching what is already attached:
      # published means published, and replacing a file someone may already have downloaded is not
      # something a re-run should do quietly. A run therefore only fills in what is missing, which
      # also keeps it from failing on an asset that is already in place and taking the changelog
      # step below down with it.
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          ATTACHED=$(gh release view "$TAG" --json assets --jq '.assets[].name')

          for file in ./build/distributions/*; do
            name=$(basename "$file")

            if grep -qxF "$name" <<< "$ATTACHED"; then
              echo "::warning::$name is already attached to $TAG - leaving it as it is."
              continue
            fi

            gh release upload "$TAG" "$file"
          done

      # Roll the release note into CHANGELOG.md and open a pull request with it.
      #
      # Everything above works from the released tag, because that is what was built and
      # published. The changelog is the one thing that does not belong to the tag: it lives on the
      # default branch and keeps growing there, so it is patched on top of that branch instead.
      # Patching the tag's copy would roll a file that is already out of date, and would carry the
      # tag's build configuration with it - which is how a release ends up with no reference-link
      # footer, the tag predating the setting that generates one.
      #
      # The section is named after the released tag rather than after whatever version the default
      # branch has moved on to.
      - name: Create Pull Request
        if: ${{ steps.release.outputs.has-note == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.tag }}
          RELEASE_NOTE: ${{ steps.release.outputs.note-file }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B $BRANCH "origin/$DEFAULT_BRANCH"

          ./gradlew patchChangelog -Pversion="$VERSION" --release-note-file="$RELEASE_NOTE"

          if git diff --quiet; then
            echo "::warning::CHANGELOG.md already has a $VERSION section - nothing to patch."
            exit 0
          fi

          git commit -am "Changelog update - $VERSION"
          git push --set-upstream origin $BRANCH

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
            --label "$LABEL" \
            --head $BRANCH
