<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
    <defs>
        <!--
          The letter is painted over the whole lens, then the ring is repainted through
          this window so the middle stem interlocks with it: the stem runs over the rim
          at the top of the circle and back under it at the bottom. The window covers
          only the lower half of the ring (y >= 18.5, the circle's centre line) - that is
          what makes the crossings alternate instead of both reading as "stem behind
          lens". Its vertical edges sit in the letter's two clear corridors (x 9.5-13 and
          x 19.75-23.5), so the repainted arc never cuts a stroke off in mid-air.
        -->
        <clipPath id="interlock"><rect x="12.5" y="18.5" width="9.5" height="21.5"/></clipPath>
        <!--
          Recolouring one arm means repainting the letter through a cut. The cut is
          vertical on purpose: it crosses the arch crest perpendicular to the stroke,
          which reads as a deliberate two-tone split. A horizontal cut there would look
          like a stray bar laid across the letter.
        -->
        <clipPath id="rightArm"><rect x="22" y="0" width="18" height="40"/></clipPath>
    </defs>

    <!-- Dark background -->
    <rect width="40" height="40" rx="8" fill="#1E1E2A"/>

    <!-- LENS - painted first, so the right arm of the letter passes in front of the handle -->
    <line x1="22.9" y1="23.8" x2="32.1" y2="33" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="17.6" cy="18.5" r="7.5" fill="#00D2FF" fill-opacity="0.10" stroke="#FFFFFF" stroke-width="3"/>

    <!--
      Lowercase italic 'm', drawn as three strokes: a bare left stem, then two arms that
      each spring off the previous stem, arc over and drop to the baseline at y=28.
    -->
    <g fill="none" stroke="#4682FA" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.2 10.5 L4.8 28"/>
        <path d="M8.3 14.2 C9.9 10.3 16.4 9.7 18.55 15 L15.3 28"/>
        <path d="M18.8 14.2 C20.4 10.3 26.9 9.7 29.05 15 L25.8 28"/>
    </g>

    <!-- Right arm in Maven red - the same arm that weaves over the lens handle -->
    <g clip-path="url(#rightArm)">
        <g fill="none" stroke="#EF4444" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.2 10.5 L4.8 28"/>
            <path d="M8.3 14.2 C9.9 10.3 16.4 9.7 18.55 15 L15.3 28"/>
            <path d="M18.8 14.2 C20.4 10.3 26.9 9.7 29.05 15 L25.8 28"/>
        </g>
    </g>

    <!-- Lower half of the ring repainted, closing the interlock with the middle stem -->
    <g clip-path="url(#interlock)">
        <circle cx="17.6" cy="18.5" r="7.5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    </g>

    <!-- Glass reflection, on top of everything -->
    <path d="M13.0 16.5 A 5 5 0 0 1 16.4 13.6" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.30"/>
</svg>
