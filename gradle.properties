# Also serves as the plugin ID (see src/main/resources/META-INF/plugin.xml).
group = cz.loplex.intellijmavenlens
# The version being worked on, marked so that it cannot be mistaken for one that has
# been released. Dropping the marker is what a release is: `prepare-release` reads the
# version off this line, commits it without the marker, and builds the release from that
# commit. Nothing has to be typed at release time, and nothing can be typed wrong.
# A pre-release is worked on as `0.3.0-beta.1-SNAPSHOT`: released, it goes to the Marketplace
# channel `beta` and is marked a pre-release on GitHub (see channel_of in .github/scripts/check-release.py).
version = 0.2.1-SNAPSHOT

# What a release tag is called in front of the version. Empty here: 0.1.0 and 0.2.0 were
# published under bare tags, which is also what `versionPrefix` in build.gradle.kts makes
# the changelog links point at. Declared even though empty, because the release tooling
# refuses to guess - read as though tags were `v*`, this repository would turn up no
# released tags at all and every check over them would pass having compared nothing.
tagPrefix =

pluginRepositoryUrl = https://github.com/loplex/intellij-maven-lens

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
