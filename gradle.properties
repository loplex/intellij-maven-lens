# Also serves as the plugin ID (see src/main/resources/META-INF/plugin.xml).
group = cz.loplex.intellijmavenlens
# Plugin version, patched into plugin.xml at build time by the IntelliJ Platform
# Gradle Plugin. The release tooling takes it verbatim - it also names the git tag
# and GitHub release, the CHANGELOG.md section header and the distribution ZIP -
# so it carries no -SNAPSHOT suffix and always holds the version being prepared.
# Bump it to the next version right after a release is published.
version = 0.1.0

pluginRepositoryUrl = https://github.com/loplex/intellij-maven-lens

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
